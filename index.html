<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LTX</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="titlebar">
    <div class="brand">
      <span class="brand-mark">▶</span>
      <span>LTX</span>
    </div>

    <div class="window-label">
      YouTube desktop
    </div>
  </div>

  <div class="app-shell">

    <aside class="sidebar">

      <nav class="nav-main">
        <button class="nav-item active" data-view="Home">
          <span class="nav-icon">⌂</span>
          Home
        </button>

        <button class="nav-item" data-view="Explore">
          <span class="nav-icon">◈</span>
          Explore
        </button>

        <button class="nav-item" data-view="Subscriptions">
          <span class="nav-icon">▤</span>
          Subscriptions
        </button>
      </nav>

      <div class="nav-divider"></div>

      <nav class="nav-main">
        <button class="nav-item" data-view="Library">
          <span class="nav-icon">▣</span>
          Library
        </button>

        <button class="nav-item" data-view="History">
          <span class="nav-icon">◷</span>
          History
        </button>

        <button class="nav-item" data-view="Watch later">
          <span class="nav-icon">◷</span>
          Watch later
        </button>

        <button class="nav-item" data-view="Liked videos">
          <span class="nav-icon">♡</span>
          Liked videos
        </button>
      </nav>

      <div class="sidebar-bottom">
        <button class="nav-item" id="settingsButton">
          <span class="nav-icon">⚙</span>
          Settings
        </button>
      </div>

    </aside>

    <main class="main">

      <header class="topbar">

        <form class="search" id="searchForm">
          <input
            id="searchInput"
            type="search"
            placeholder="Search YouTube"
            autocomplete="off"
          >

          <button type="submit" aria-label="Search">
            ⌕
          </button>
        </form>

        <button
          class="icon-button"
          id="profileButton"
          aria-label="Profile"
        >
          L
        </button>

      </header>

      <div class="filters">
        <button class="filter active">All</button>
        <button class="filter">Gaming</button>
        <button class="filter">Music</button>
        <button class="filter">Live</button>
        <button class="filter">Mixes</button>
        <button class="filter">Recently uploaded</button>
      </div>

      <section class="featured">

        <div class="player-wrap">
          <div class="player">
            <iframe
              id="youtubePlayer"
              src="https://www.youtube-nocookie.com/embed/aqz-KE-bpKQ?rel=0"
              title="YouTube video player"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              referrerpolicy="strict-origin-when-cross-origin"
              allowfullscreen
            ></iframe>
          </div>
        </div>

        <div class="featured-info">

          <div class="eyebrow">
            NOW PLAYING
          </div>

          <h1 id="videoTitle">
            Big Buck Bunny — Official Video
          </h1>

          <p class="channel">
            YouTube · Demo video
          </p>

          <p class="description">
            A minimal desktop experience for watching videos.
            Select a video below to load it here.
          </p>

          <div class="featured-actions">

            <button class="pill-button primary" id="openYoutube">
              Open on YouTube ↗
            </button>

            <button class="pill-button" id="copyVideo">
              Copy video link
            </button>

          </div>

        </div>

      </section>

      <section class="section">

        <div class="section-heading">
          <h2>Recommended</h2>
          <span class="muted">Prototype picks</span>
        </div>

        <div class="video-grid" id="videoGrid"></div>

      </section>

    </main>

  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="renderer.js"></script>

</body>
</html>
