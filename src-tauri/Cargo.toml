[package]
name = "ltx"
version = "0.1.0"
description = "LTX desktop YouTube client"
authors = ["Lunyx"]
edition = "2021"

[lib]
name = "ltx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

reqwest = {
    version = "0.12",
    default-features = false,
    features = ["json", "rustls-tls"]
}
